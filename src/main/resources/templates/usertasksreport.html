<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>JustDoIt! - Reporte de Usuario</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo">
            <a th:href="@{/}"><img th:src="@{/images/JustDoIt.png}" alt="JustDoIt Logo" width="200" height="200"></a>
        </div>

        <div th:replace="fragments/fragmento-nav :: nav()"></div>
    </aside>

    <main class="content">
        <h1>Reporte de tareas del usuario</h1>

        <div th:replace="fragments/user-info :: userInfo()"></div>

        <section class="reportTable">
            <table>
                <thead>
                <tr>
                    <th>Tarea</th>
                    <th>Estado</th>
                    <th>Fecha límite</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="task : ${user.tasks}">
                    <td th:text="${task.description}">Descripción</td>
                    <td th:switch="${task.status.name()}">
                        <span th:case="'DONE'">Completada</span>
                        <span th:case="'INPROGRESS'">En Proceso</span>
                        <span th:case="'PENDING'">Pendiente</span>
                        <span th:case="*">Desconocido</span>
                    </td>
                    <td th:text="${task.deadline != null ? task.deadline : 'No especificado'}">Fecha</td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>
</body>
</html>
